# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NKRO support
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Prevent using some consumer key codes, but allows compatibility with more host OSes. See: https://zmk.dev/docs/config/system
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Uncomment the following to enable deep sleep, default timeout is 15min
CONFIG_ZMK_SLEEP=y
# Set deep sleep timeout to 1h
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Set debounce settings (default is 5 for both)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Mouse emulation support and smooth scrolling
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Peripheral preferred min/max connection interval in 1.25ms units. Set 7.5ms-15ms (6-12) BLE polling range.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# Aggregate config that enables both CONFIG_ZMK_BLE_EXPERIMENTAL_CONN and CONFIG_ZMK_BLE_EXPERIMENTAL_SEC. See: https://zmk.dev/docs/config/bluetooth. Allows overwrite of keys from prior connection, fixing stale bond issue.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Improve compatibility Windows Bluetooth chipsets. Should also be disabled as part of CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y already
CONFIG_BT_CTLR_PHY_2M=n
# Maximize BT transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Enable passkey entry during pairing for enhanced security
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Dynamic Macro Module Settings
# RAM slots clear on reboot. Set to 48 to get the maximum possible event count
## for the mapped macros: the shared pool is sized at compile time as
## AVG_EVENTS_PER_SLOT x SLOT_COUNT, and AVG is capped at 64, so the slot count
## is the only lever. 48 x 64 = 3072 pool events -> 1536 (768 keystrokes)
## per macro with both slots full. Lower the slot count if you run out of RAM.
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_RAM_SLOTS=48
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_AVG_EVENTS_PER_SLOT=64
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_MAX_EVENTS=1536
# RAM only: macros don't survive reboot. Makes ...NVS_SLOTS irrelevant
## (option doesn't exist when PERSIST=n; NVS_SLOTS defaults to 0 in code).
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_PERSIST=n
#CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_NVS_SLOTS=2
# Status key: header + lines for used slots only (not all 48 allocated ones)
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_STATUS_USED=y
# Typed feedback level: COMMAND = confirmations, no empty-slot chatter
# (VERBOSE is the default; setting only ..._VERBOSE=n would NOT disable it)
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_FEEDBACK_COMMAND=y
# Host locale: US is the default and closest to Finnish (QWERTY); feedback
## renders correctly except possibly ':'/'(' in verbose previews
#CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_LOCALE_US=y